# "Off the Sheet": personal projects hosted on GitHub Pages. Not client work.
# Screenshots: content/images/off-sheet/<key>.png (1440x900). Add a project = one entry under `items`.
en:
  name: Off the Sheet
  collar: Off-sheet · Personal projects
  strip: 'Things I build for fun after hours. Not client work and not case studies: small experiments, some unfinished.'
  lede: 'Personal projects I build for fun, outside client work. They are sketches, not survey sheets: unpolished, sometimes unfinished, and mostly about learning a tool or a subject.'
  glanceTitle: About these
  glance:
    - [Status, 'Personal projects, built for fun. No client, no brief.']
    - [Expect, 'Rough edges. The 3D ones run best in a desktop browser.']
    - [Where, 'Each one is its own site on GitHub Pages and opens in a new tab.']
  foot: Want the work that pays the bills? See Projects for case studies.
  all: See all five
  sketches: sketches
  domains: domains
id:
  name: Di Luar Lembar
  collar: Di luar lembar · Proyek pribadi
  strip: 'Hal-hal yang saya buat untuk bersenang-senang di luar jam kerja. Bukan pekerjaan klien dan bukan studi kasus: eksperimen kecil, sebagian belum selesai.'
  lede: 'Proyek pribadi yang saya buat untuk bersenang-senang, di luar pekerjaan klien. Ini sketsa, bukan lembar survei: belum dipoles, kadang belum selesai, dan sebagian besar tentang belajar alat atau topik baru.'
  glanceTitle: Tentang proyek ini
  glance:
    - [Status, 'Proyek pribadi, dibuat untuk bersenang-senang. Tanpa klien, tanpa brief.']
    - [Catatan, 'Masih kasar. Yang 3D paling lancar di browser desktop.']
    - [Lokasi, 'Masing-masing situs sendiri di GitHub Pages, terbuka di tab baru.']
  foot: Mencari pekerjaan profesional? Lihat Proyek untuk studi kasus.
  all: Lihat kelimanya
  sketches: sketsa
  domains: bidang

# Line style of the swatch is set by `key` in global.css (.swatch[data-dom]).
domains:
  - key: geo
    name: { en: Geospatial, id: Geospasial }
    note: { en: 'Maps and terrain, for the joy of it', id: 'Peta dan medan, sekadar hobi' }
  - key: drone
    name: { en: Drones & autonomy, id: Drone & otonomi }
    note: { en: Simulations of things that fly, id: Simulasi benda yang terbang }
  - key: explain
    name: { en: Explainers & learning, id: Penjelas & belajar }
    note: { en: Interactive ways to understand a subject, id: Cara interaktif memahami sebuah topik }

items:
  - key: terrain-atlas
    domain: geo
    title: { en: Humbang Terrain Sheet, id: Humbang Terrain Sheet }
    stack: { en: MapLibre GL · PMTiles, id: MapLibre GL · PMTiles }
    desc:
      en: A 3D drone terrain viewer of a 26.5 km² survey in North Sumatra. Swipe between the orthomosaic and a relief surface model with contours.
      id: Penampil medan 3D dari survei drone seluas 26,5 km² di Sumatera Utara. Geser antara orthomosaic dan model permukaan relief dengan kontur.
  - key: SwarmLab
    domain: drone
    title: { en: SwarmLab, id: SwarmLab }
    stack: { en: three.js, id: three.js }
    desc:
      en: A drone swarm simulator. Set up to 100 drones, an algorithm and targets, then watch coverage and comms play out in 3D.
      id: Simulator kawanan drone. Atur hingga 100 drone, algoritme, dan target, lalu lihat cakupan dan komunikasinya dalam 3D.
  - key: benchtop
    domain: explain
    title: { en: Benchtop, id: Benchtop }
    stack: { en: 3D · 8 explainers, id: 3D · 8 penjelas }
    desc:
      en: 'Eight interactive 3D explainers, each a small room you can poke at: moon phases, a prism, a pendulum, a flooding valley, why prices rise.'
      id: 'Delapan penjelas 3D interaktif, masing-masing ruangan kecil yang bisa dicoba: fase bulan, prisma, bandul, lembah banjir, mengapa harga naik.'
  - key: chinese_history
    domain: explain
    title: { en: Middle Kingdom Explorer, id: Middle Kingdom Explorer }
    stack: { en: Timeline · Map, id: Linimasa · Peta }
    desc:
      en: 4,000 years of Chinese history as one scrolling timeline and a living map of shifting borders.
      id: 4.000 tahun sejarah Tiongkok dalam satu linimasa bergulir dan peta perbatasan yang hidup.
  - key: uav-mapping-101
    domain: explain
    title: { en: UAV Mapping 101, id: UAV Mapping 101 }
    stack: { en: Interactive · 10 topics, id: Interaktif · 10 topik }
    desc:
      en: 'How a drone turns photos into an accurate map, in ten interactive steps: pick a job, plan the flight, set RTK and GCPs, process, then check accuracy.'
      id: 'Bagaimana drone mengubah foto menjadi peta yang akurat, dalam sepuluh langkah interaktif: pilih pekerjaan, rencanakan terbang, atur RTK dan GCP, olah data, lalu cek akurasi.'
